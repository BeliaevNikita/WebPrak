<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Ошибка', ~{::main})}">
<main class="flex-grow-1 py-4">
    <section class="container text-center py-5">
        <h1 class="display-6">Ошибка</h1>
        <p class="text-muted" th:text="${message}">Не удалось выполнить запрос.</p>
        <a class="btn btn-primary" th:href="@{/}">На главную</a>
    </section>
</main>
</html>
