<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Управление книгами', ~{::main})}">
<main class="flex-grow-1 py-4">
    <section class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h1 class="h2 mb-1">Книги</h1>
                <p class="text-muted mb-0">Управление каталогом, ценами и складскими остатками.</p>
            </div>
            <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#addBookForm">
                Добавить книгу
            </button>
        </div>

        <form class="row g-3 border rounded p-3 bg-light mb-4" th:action="@{/admin/books}" method="get">
            <div class="col-md-3">
                <label class="form-label" for="title">Название</label>
                <input id="title" class="form-control" type="text" name="title" th:value="${param.title}">
            </div>
            <div class="col-md-3">
                <label class="form-label" for="author">Автор</label>
                <input id="author" class="form-control" type="text" name="author" th:value="${param.author}">
            </div>
            <div class="col-md-2">
                <label class="form-label" for="language">Язык</label>
                <input id="language" class="form-control" type="text" name="language" th:value="${param.language}">
            </div>
            <div class="col-md-2">
                <label class="form-label" for="available">Наличие</label>
                <select id="available" class="form-select" name="available">
                    <option value="">Все</option>
                    <option value="true">В наличии</option>
                    <option value="false">Нет в наличии</option>
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-outline-primary w-100" type="submit">Фильтровать</button>
            </div>
        </form>

        <div id="addBookForm" class="collapse mb-4">
            <form class="border rounded p-3" th:action="@{/admin/books}" method="post">
                <h2 class="h5 mb-3">Добавление книги</h2>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="newTitle">Название</label>
                        <input id="newTitle" class="form-control" type="text" name="title" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="newPublisher">Издательство</label>
                        <input id="newPublisher" class="form-control" type="text" name="publisher" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="newLanguage">Язык</label>
                        <input id="newLanguage" class="form-control" type="text" name="language" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="newPrice">Цена</label>
                        <input id="newPrice" class="form-control" type="number" step="0.01" min="0" name="price" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="newQuantity">Остаток</label>
                        <input id="newQuantity" class="form-control" type="number" min="0" name="quantity" required>
                    </div>
                    <div class="col-md-10 d-flex align-items-end">
                        <button class="btn btn-primary" type="submit">Добавить</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Издательство</th>
                    <th>Язык</th>
                    <th>Цена</th>
                    <th>Остаток</th>
                    <th>Редактирование</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}">1</td>
                    <td th:text="${book.work.title}">Название</td>
                    <td th:text="${book.publisher}">Издательство</td>
                    <td th:text="${book.language}">RU</td>
                    <td th:text="${book.price}">0.00</td>
                    <td th:text="${book.quantity}">0</td>
                    <td>
                        <form class="row g-2" th:action="@{/admin/books/{id}/update(id=${book.id})}" method="post">
                            <div class="col-6 col-xl-3">
                                <input class="form-control form-control-sm" type="text" name="publisher"
                                       th:value="${book.publisher}" aria-label="Издательство">
                            </div>
                            <div class="col-6 col-xl-2">
                                <input class="form-control form-control-sm" type="text" name="language"
                                       th:value="${book.language}" aria-label="Язык">
                            </div>
                            <div class="col-6 col-xl-2">
                                <input class="form-control form-control-sm" type="number" step="0.01" min="0"
                                       name="price" th:value="${book.price}" aria-label="Цена">
                            </div>
                            <div class="col-6 col-xl-2">
                                <input class="form-control form-control-sm" type="number" min="0"
                                       name="quantity" th:value="${book.quantity}" aria-label="Остаток">
                            </div>
                            <div class="col-12 col-xl-3">
                                <button class="btn btn-sm btn-outline-primary w-100" type="submit">Сохранить</button>
                            </div>
                        </form>
                    </td>
                    <td class="text-end">
                        <form th:action="@{/admin/books/{id}/delete(id=${book.id})}" method="post">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="alert alert-secondary" th:if="${books == null || books.isEmpty()}">
            Книги не найдены.
        </div>
    </section>
</main>
</html>
