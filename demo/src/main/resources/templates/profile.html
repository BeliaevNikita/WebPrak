<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout('Личный кабинет', ~{::main})}">
<main class="flex-grow-1 py-4">
    <section class="container">
        <h1 class="h2 mb-4">Личный кабинет</h1>

        <div class="row g-4 mb-5">
            <div class="col-lg-6">
                <form class="border rounded p-4 bg-light" th:action="@{/profile/update}" method="post">
                    <h2 class="h5 mb-3">Редактирование профиля</h2>

                    <div class="mb-3">
                        <label class="form-label" for="login">Логин</label>
                        <input id="login" class="form-control" type="text" th:value="${user.login}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="firstName">Имя</label>
                        <input id="firstName" class="form-control" type="text" name="firstName"
                               th:value="${user.firstName}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="lastName">Фамилия</label>
                        <input id="lastName" class="form-control" type="text" name="lastName"
                               th:value="${user.lastName}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input id="email" class="form-control" type="email" name="email"
                               th:value="${email}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="phone">Телефон</label>
                        <input id="phone" class="form-control" type="tel" name="phone"
                               th:value="${phone}">
                    </div>

                    <button class="btn btn-primary" type="submit">Сохранить</button>
                </form>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Мои заказы</h2>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th scope="col">ID заказа</th>
                    <th scope="col">Дата</th>
                    <th scope="col">Статус</th>
                    <th scope="col">Адрес доставки</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.id}">1</td>
                    <td th:text="${order.orderDate}">2024-01-01</td>
                    <td th:text="${order.status}">DRAFT</td>
                    <td th:text="${order.deliveryAddress}">Москва</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/orders/{id}(id=${order.id})}">Открыть</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="alert alert-secondary" th:if="${orders == null || orders.isEmpty()}">
            У пользователя пока нет заказов.
        </div>
    </section>
</main>
</html>
