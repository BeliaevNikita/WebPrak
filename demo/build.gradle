plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

springBoot {
	mainClass = 'ru.msu.cmc.webprak.WebPrakApplication'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.seleniumhq.selenium:selenium-java:4.43.0'
	testImplementation 'org.seleniumhq.selenium:selenium-devtools-v147:4.43.0'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
	testImplementation 'org.testcontainers:postgresql:1.21.3'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	def testLogFile = layout.buildDirectory.file('test-results/test/all-tests.log')
	def appendToTestLog = { String message ->
		def file = testLogFile.get().asFile
		file.parentFile.mkdirs()
		file.append(message + System.lineSeparator(), 'UTF-8')
	}

	doFirst {
		def file = testLogFile.get().asFile
		file.parentFile.mkdirs()
		file.text = ''
		appendToTestLog("Test run started: ${new Date()}")
	}

	beforeTest { descriptor ->
		appendToTestLog("START ${descriptor.className}.${descriptor.name}")
	}

	afterTest { descriptor, result ->
		appendToTestLog("END ${descriptor.className}.${descriptor.name} -> ${result.resultType} (${result.endTime - result.startTime} ms)")
		if (result.exception != null) {
			appendToTestLog(result.exception.toString())
			result.exception.stackTrace.each { appendToTestLog("\tat ${it}") }
		}
	}

	onOutput { descriptor, event ->
		appendToTestLog("${event.destination} ${descriptor.className}.${descriptor.name}: ${event.message.trim()}")
	}

	afterSuite { descriptor, result ->
		if (descriptor.parent == null) {
			appendToTestLog("Test run finished: ${new Date()}")
			appendToTestLog("Result: ${result.resultType}; tests: ${result.testCount}, succeeded: ${result.successfulTestCount}, failed: ${result.failedTestCount}, skipped: ${result.skippedTestCount}")
		}
	}
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')

	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}
